<script>
    const CONTRACT_ADDRESS = "0x919bb40F757F4eb50FcC7fBBf5E703FC8463CF38";
    const RPC_URL = "http://localhost:8080";

    let userAddress = null;
    let provider = null;

    function updateLog(message) {
        document.getElementById("consoleLog").innerText =
            `[LOG] ${new Date().toLocaleTimeString()}:\n${message}`;
    }

    /*
     * REAL WALLET CONNECTION
     * No simulated address or RPC fallback.
     */
    async function connectWallet() {
        if (!window.ethereum && !window.genlayer) {
            updateLog(
                "Wallet connection failed.\n" +
                "No supported browser wallet provider was detected."
            );
            return;
        }

        try {
            provider = window.genlayer || window.ethereum;

            const accounts = await provider.request({
                method: "eth_requestAccounts"
            });

            if (!accounts || !accounts.length) {
                throw new Error("No wallet account was returned by the provider.");
            }

            userAddress = accounts[0];

            updateLog(
                `Wallet connected successfully.\n` +
                `Account address: ${userAddress}`
            );

        } catch (err) {
            userAddress = null;

            updateLog(
                `Wallet connection failed.\n${getReadableError(err)}`
            );
        }
    }

    /*
     * Convert provider/RPC errors into readable messages
     * without hiding the actual failure.
     */
    function getReadableError(error) {
        if (!error) {
            return "Unknown error.";
        }

        if (error.code === 4001) {
            return "Transaction or wallet request was rejected by the user.";
        }

        if (error.message) {
            return error.message;
        }

        return String(error);
    }

    /*
     * REAL RPC TRANSACTION PATH
     *
     * Important:
     * This function never returns fake success data.
     * If the RPC fails, the error is thrown and handled by the UI.
     */
    async function sendGenLayerTransaction(methodName, argsArray) {
        if (!userAddress) {
            throw new Error(
                "No wallet is connected. Connect a real wallet before submitting a transaction."
            );
        }

        updateLog(
            `Preparing real contract transaction...\n` +
            `Target method: ${methodName}\n` +
            `Arguments: ${JSON.stringify(argsArray)}`
        );

        const response = await fetch(RPC_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                jsonrpc: "2.0",
                method: "gen_sendTransaction",
                params: {
                    from: userAddress,
                    to: CONTRACT_ADDRESS,
                    data: {
                        method: methodName,
                        args: argsArray
                    }
                },
                id: Date.now()
            })
        });

        if (!response.ok) {
            throw new Error(
                `GenLayer RPC HTTP error: ${response.status} ${response.statusText}`
            );
        }

        const resData = await response.json();

        if (resData.error) {
            throw new Error(
                resData.error.message ||
                JSON.stringify(resData.error)
            );
        }

        if (typeof resData.result === "undefined") {
            throw new Error(
                "GenLayer RPC returned no transaction result."
            );
        }

        return resData.result;
    }

    async function triggerCreateTask() {
        const title = document.getElementById("taskTitle").value.trim();
        const criteria = document.getElementById("taskCriteria").value.trim();

        if (!title || !criteria) {
            updateLog("Error: Missing task title or validation criteria.");
            return;
        }

        try {
            const result = await sendGenLayerTransaction(
                "create_task",
                [
                    title,
                    "Project submission payload tracking",
                    criteria
                ]
            );

            updateLog(
                `Create task transaction submitted successfully.\n` +
                `${JSON.stringify(result, null, 2)}`
            );

        } catch (err) {
            updateLog(
                `Create task failed.\n${getReadableError(err)}`
            );
        }
    }

    async function triggerClaimTask() {
        const id = document.getElementById("taskId").value.trim();

        if (!id) {
            updateLog("Error: Missing Task ID.");
            return;
        }

        try {
            const result = await sendGenLayerTransaction(
                "claim_task",
                [id]
            );

            updateLog(
                `Claim task transaction submitted successfully.\n` +
                `${JSON.stringify(result, null, 2)}`
            );

        } catch (err) {
            updateLog(
                `Claim task failed.\n${getReadableError(err)}`
            );
        }
    }

    async function triggerSubmitProof() {
        const id = document.getElementById("taskId").value.trim();
        const url = document.getElementById("proofUrl").value.trim();

        if (!id || !url) {
            updateLog("Error: Missing Task ID or proof URL.");
            return;
        }

        try {
            const result = await sendGenLayerTransaction(
                "submit_proof",
                [id, url]
            );

            updateLog(
                `Proof submission transaction submitted successfully.\n` +
                `${JSON.stringify(result, null, 2)}`
            );

        } catch (err) {
            updateLog(
                `Proof submission failed.\n${getReadableError(err)}`
            );
        }
    }

    async function triggerVerifyTask() {
        const id = document.getElementById("taskId").value.trim();

        if (!id) {
            updateLog("Error: Provide a Task ID.");
            return;
        }

        updateLog(
            `Requesting real GenLayer contract execution...\n` +
            `Method: verify_task\nTask ID: ${id}`
        );

        try {
            const result = await sendGenLayerTransaction(
                "verify_task",
                [id]
            );

            updateLog(
                `Verification transaction submitted successfully.\n` +
                `${JSON.stringify(result, null, 2)}`
            );

        } catch (err) {
            updateLog(
                `Verification failed.\n${getReadableError(err)}`
            );
        }
    }

    /*
     * REAL CONTRACT-DERIVED READ
     *
     * There is deliberately NO mock-data fallback here.
     */
    async function readTaskState() {
        const id = document.getElementById("taskId").value.trim();

        if (!id) {
            updateLog("Error: Provide a Task ID to read state.");
            return;
        }

        updateLog(
            `Querying real contract-derived read view...\n` +
            `Method: get_task(${id})`
        );

        try {
            const response = await fetch(RPC_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    jsonrpc: "2.0",
                    method: "gen_call",
                    params: {
                        to: CONTRACT_ADDRESS,
                        data: {
                            method: "get_task",
                            args: [id]
                        }
                    },
                    id: Date.now()
                })
            });

            if (!response.ok) {
                throw new Error(
                    `GenLayer RPC HTTP error: ${response.status} ${response.statusText}`
                );
            }

            const resData = await response.json();

            /*
             * IMPORTANT:
             * A JSON-RPC error is a real failure.
             * Do not replace it with mock data.
             */
            if (resData.error) {
                throw new Error(
                    resData.error.message ||
                    JSON.stringify(resData.error)
                );
            }

            if (typeof resData.result === "undefined") {
                throw new Error(
                    "GenLayer RPC returned no contract state."
                );
            }

            /*
             * Use the actual value returned by get_task().
             * No "Sample Task", fake status, fake worker,
             * or fake proof URL is inserted here.
             */
            const parsedTask =
                typeof resData.result === "string"
                    ? JSON.parse(resData.result)
                    : resData.result;

            updateLog(
                `Contract-Derived Read View Success!\n` +
                `Status: ${parsedTask.status ?? "Unavailable"}\n` +
                `State:\n${JSON.stringify(parsedTask, null, 2)}`
            );

        } catch (err) {
            /*
             * THIS IS THE CRITICAL FIX.
             *
             * A failed contract read stays a failed contract read.
             * There is NO simulated result.
             */
            updateLog(
                `Contract-Derived Read View Failed.\n` +
                `${getReadableError(err)}`
            );
        }
    }

    /*
     * Keep the displayed wallet state synchronized with the
     * real browser wallet.
     */
    if (window.ethereum) {
        window.ethereum.on("accountsChanged", (accounts) => {
            userAddress = accounts && accounts.length
                ? accounts[0]
                : null;

            if (userAddress) {
                updateLog(
                    `Wallet account changed.\n` +
                    `Account address: ${userAddress}`
                );
            } else {
                updateLog("Wallet disconnected.");
            }
        });

        window.ethereum.on("chainChanged", () => {
            updateLog(
                "Wallet network changed. Reconnect or refresh the DApp before submitting another transaction."
            );
        });
    }
</script>
