<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Verifier DApp - Production</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    button { background: #2563eb; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .console { background: #000; padding: 10px; font-family: monospace; color: #22c55e; border-radius: 4px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>GenLayer AI Task Verifier</h2>
  <div>Connected to Contract Address: <code>0x919bb40F757F4eb50FcC7fBBf5E703FC8463CF38</code></div>

  <hr style="border-color: #333; margin: 20px 0;">

  <!-- SECTION CHANGED: "Initialize GenLayer Provider Path" turned into "Connect Wallet" -->
  <h3>Connect Wallet</h3>
  <button id="connectWalletBtn">Connect Wallet</button>

  <hr style="border-color: #333; margin: 20px 0;">

  <h3>1. Create an Intelligent Task Milestone</h3>
  <button disabled>Register Milestone On-Chain</button>

  <h3>2. DApp Workflow Actions & Contract-Derived Reads</h3>
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <button disabled>Claim Task Target</button>
    <button disabled>Submit Work Proof</button>
    <button disabled>Execute Decentralized AI Auditing</button>
    <button disabled>Read Task Real-Time On-Chain State</button>
  </div>

  <h3>System Transaction Console</h3>
  <div class="console" id="logConsole">Awaiting local wallet execution commands...</div>

  <!-- CORE DAPP LOGIC MODULE CONNECTION -->
  <script type="module">
    import { useDAppWorkflow } from './hooks/useDAppWorkflow.js';

    // 1. Initialize the custom hook logic workflow
    const dApp = useDAppWorkflow();
    
    const connectBtn = document.getElementById('connectWalletBtn');
    const logConsole = document.getElementById('logConsole');

    // 2. Bind click interaction directly to user gesture to clear browser popup blockers
    connectBtn.addEventListener('click', async () => {
      // Direct call ensures the window.ethereum request runs immediately inside the listener
      const accounts = await dApp.connectWallet();
      
      if (accounts && accounts.length > 0) {
        const address = accounts[0];
        connectBtn.innerText = `Connected: ${address.slice(0,6)}...${address.slice(-4)}`;
        connectBtn.style.backgroundColor = "#16a34a"; // Changes button color to green on successful connection
      }
    });

    // 3. Keep the user interface updated with custom state logs from the hook
    setInterval(() => {
      if (dApp.logs && dApp.logs.length > 0) {
        const latestLog = dApp.logs[dApp.logs.length - 1];
        logConsole.innerText = latestLog.text;
        if (latestLog.type === 'error') logConsole.style.color = '#ef4444';
        if (latestLog.type === 'success') logConsole.style.color = '#22c55e';
        if (latestLog.type === 'pending') logConsole.style.color = '#eab308';
      }
    }, 500);
  </script>

</body>
</html>
